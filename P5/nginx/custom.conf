# =============================================================================
# custom.conf — Custom configuration for nginx-proxy
# =============================================================================
# This file is mounted at /etc/nginx/conf.d/custom.conf inside the
# nginx-proxy container to adjust global proxy settings.
# =============================================================================

# -- Max upload size (Nginx defaults to 1MB)
client_max_body_size 20m;

# -- Timeouts for slow backends (useful for SSR and document generation)
proxy_connect_timeout 60s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# -- WebSocket support (required for Socket.io in P3/api-auth)
# nginx-proxy already handles WebSockets automatically, but these headers
# reinforce compatibility in edge-case scenarios.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# -- Additional security headers
# (nginx-proxy already adds X-Real-IP and X-Forwarded-For)
proxy_set_header X-Forwarded-Proto $scheme;

# -- Gzip compression for static assets
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;
