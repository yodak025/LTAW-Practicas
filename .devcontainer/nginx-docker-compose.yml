version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ltaw-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - landing
      - tienda
      - game
    networks:
      - ltaw-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Landing Page - Astro
  landing:
    build:
      context: ../
      dockerfile: .devcontainer/landing/Dockerfile
    container_name: ltaw-landing
    environment:
      - NODE_ENV=production
    networks:
      - ltaw-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4321"]
      interval: 30s
      timeout: 10s
      retries: 3

  # P2 - Tienda Online con SSR
  tienda:
    build:
      context: ../
      dockerfile: .devcontainer/p2-tienda/Dockerfile
    container_name: ltaw-tienda
    volumes:
      - ../P2/server/tienda.json:/app/P2/server/tienda.json
    environment:
      - NODE_ENV=production
      - PORT=8001
    networks:
      - ltaw-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8001"]
      interval: 30s
      timeout: 10s
      retries: 3

  # P3 - Kill Two Birds with One Stone Game
  game:
    build:
      context: ../
      dockerfile: .devcontainer/p3-game/Dockerfile
    container_name: ltaw-game
    environment:
      - NODE_ENV=production
      - PORT=9000
    networks:
      - ltaw-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ltaw-network:
    driver: bridge
    name: ltaw-network
